<style>

:root{
    --primary:#00e5ff;
    --secondary:#0077ff;
    --bg:#050816;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:'Rajdhani',sans-serif;
    background:var(--bg);
    color:#fff;
    position:relative;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color:transparent;
}

.background{
    position:fixed;
    inset:0;

    background:
    linear-gradient(rgba(2,3,10,.60), rgba(5,8,22,.75)),
    url('Fundo.jpg') center center/cover no-repeat;

    transform:scale(1.02);

    z-index:-5;
}

.background::after{
    content:'';
    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at top, rgba(0,229,255,.18), transparent 40%),
    radial-gradient(circle at bottom, rgba(0,119,255,.15), transparent 40%);
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-4;
    pointer-events:none;
}

.container{
    width:min(95%, 980px);
    margin:auto;
    padding:35px 15px 80px;
    position:relative;
    z-index:2;
}
